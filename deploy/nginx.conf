# nginx site for Song Ratings on the Raspberry Pi. The site is plain static
# files, so nginx serves them straight from the cloned repo.
# Install steps are in README.md ("Put it on a Raspberry Pi").

server {
    # Only reachable from the Pi itself; Tailscale provides HTTPS in front.
    listen 127.0.0.1:8000;
    root /var/www/song_rating;
    index index.html;

    # Re-check files on every load so updates show up right away.
    add_header Cache-Control "no-cache";

    # Don't serve the git history, hidden files, or deploy configs.
    location ~ /\. { deny all; }
    location /deploy/ { deny all; }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
    }

    # Song search: itunes.apple.com redirects iPhones to the Music app, so
    # js/api.js asks Apple through here instead. The host is looked up per
    # request (resolver + variable) so nginx still starts if Wi-Fi is slow
    # to connect at boot.
    location /itunes/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $itunes_host itunes.apple.com;
        rewrite ^/itunes/(.*)$ /$1 break;
        proxy_pass https://$itunes_host;
        proxy_set_header Host $itunes_host;
        proxy_set_header User-Agent "SongRatings";
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_ssl_server_name on;
    }
}
