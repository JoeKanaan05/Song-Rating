<head>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <header id="site-header" class="site-header"></header>

  <main class="container prose">
    <h1>About</h1>
    <p>Write a short intro about yourself and why you rate songs.</p>

    <h2>How I rate</h2>
    <ul class="scale">
      <li><span class="rating-badge rating-sm tier-great">9–10</span> An all-time favourite. Essential listening.</li>
      <li><span class="rating-badge rating-sm tier-good">7–8.9</span> Great song, on regular rotation.</li>
      <li><span class="rating-badge rating-sm tier-okay">5–6.9</span> Fine, with some good moments.</li>
      <li><span class="rating-badge rating-sm tier-bad">0–4.9</span> Not for me.</li>
    </ul>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
