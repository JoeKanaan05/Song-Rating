<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Add New · Song Ratings</title>
  <link rel="icon" href="assets/icons/favicon.ico" sizes="32x32">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Ratings">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#e4f4f6">
  <script src="js/theme.js"></script>
  <!-- Inter for non-Apple devices (Apple devices use SF Pro). Loaded without
       blocking the first paint; offline it simply falls back to system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header id="site-header" class="site-sidebar"></header>

  <main>
    <!-- Step 1: search the catalog -->
    <section id="search-view">
      <div class="page-head">
        <h1>Add new</h1>
        <p class="muted">Search any song. Its full album gets added too.</p>
      </div>
      <div class="filters">
        <input id="search" type="search" placeholder="Song, artist, or album…" aria-label="Search songs" autocomplete="off" autofocus>
      </div>
      <p id="search-status" class="muted"></p>
      <div id="search-results" class="song-list"></div>
    </section>

    <!-- Step 2: rate the chosen song -->
    <section id="rate-view" hidden>
      <a href="#" id="back-to-search" class="back-link">Back to search</a>
      <div id="rate-content"></div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/pages/add.js"></script>
</body>
</html>
