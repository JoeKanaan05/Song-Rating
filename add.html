<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New · Song Ratings</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Ratings">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="container">
    <!-- Step 1: search the catalog -->
    <section id="search-view">
      <div class="page-head">
        <h1>Add new</h1>
        <p class="muted">Search any song. Its full album gets added too.</p>
      </div>
      <div class="filters">
        <input id="search" type="search" placeholder="Song, artist, or album…" aria-label="Search songs" autocomplete="off" autofocus>
      </div>
      <p id="search-status" class="muted"></p>
      <div id="search-results" class="song-list"></div>
    </section>

    <!-- Step 2: rate the chosen song -->
    <section id="rate-view" hidden>
      <a href="#" id="back-to-search" class="back-link">← Back to search</a>
      <div id="rate-content"></div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages/add.js"></script>
</body>
</html>
