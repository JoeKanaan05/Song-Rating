<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Albums · Song Ratings</title>
  <link rel="icon" href="assets/icons/favicon.ico" sizes="32x32">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Ratings">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#e4f4f6">
  <script src="js/theme.js"></script>
  <!-- Inter for non-Apple devices (Apple devices use SF Pro). Loaded without
       blocking the first paint; offline it simply falls back to system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header id="site-header" class="site-sidebar"></header>

  <main>
    <div class="page-head">
      <h1>Albums</h1>
      <p id="result-count" class="muted"></p>
      <div class="page-actions">
        <button id="export-button" class="button">Export backup</button>
        <button id="import-button" class="button">Import</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
    </div>

    <div class="filters">
      <input id="search" type="search" placeholder="Search album, artist, song…" aria-label="Search albums">
      <select id="genre" aria-label="Filter by genre">
        <option value="">All genres</option>
      </select>
      <select id="sort" aria-label="Sort albums">
        <option value="recent">Recently rated</option>
        <option value="rating-desc">Highest average</option>
        <option value="rating-asc">Lowest average</option>
        <option value="title-asc">Title A–Z</option>
        <option value="artist-asc">Artist A–Z</option>
        <option value="year-desc">Release year</option>
      </select>
    </div>

    <div id="albums-grid" class="album-grid"></div>
    <button id="load-more" class="button load-more" hidden>Load more</button>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/pages/albums.js"></script>
</body>
</html>
